name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Lint, formázás, tesztek
    runs-on: ubuntu-latest

    steps:
      - name: Projekt letöltése
        uses: actions/checkout@v7

      - name: Python telepítése
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Függőségek telepítése
        run: pip install -r requirements-dev.txt

      - name: Linting (Ruff statikus kódelemzés)
        run: ruff check .

      - name: Formatting (Ruff kódformázás ellenőrzése)
        run: ruff format --check .

      - name: Tesztek futtatása
        run: pytest
